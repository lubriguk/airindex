openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: airports
    description: BTS on-time performance for selected departure airports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /airports:
    get:
      operationId: listAirports
      tags: [airports]
      summary: List the supported departure airports
      responses:
        "200":
          description: Supported airport codes and names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Airport"
  /data-status:
    get:
      operationId: getDataStatus
      tags: [airports]
      summary: Dataset source and imported date coverage
      responses:
        "200":
          description: Current SQL dataset coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStatus"
  /delays/hub-ranking:
    get:
      operationId: getHubDelayRanking
      tags: [airports]
      summary: Rank the selected hubs and major bases by delayed-departure percentage
      description: >-
        Across all reporting airlines, group BTS daily rows by departure airport
        for the optional date range. The percentage is delayedDepartures divided
        by departureFlights, with a delay defined as 15 minutes or more.
        Only the 23 tracked airports in the supplied hub/base list are included;
        GUM is outside dataset coverage. Rows with no departure flights are omitted.
        Sorted by delayedDeparturePct descending, then airport code.
        This comparison is independent of the single-airport airline and metric filters.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Hub and base airport delay ranking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HubDelayRank"
        "400":
          description: Invalid date range
  /delays/summary:
    get:
      operationId: getDelaySummary
      tags: [airports]
      summary: Key flight and delay metrics for an airport
      parameters:
        - $ref: "#/components/parameters/Airport"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Airline"
        - $ref: "#/components/parameters/MetricRule"
      responses:
        "200":
          description: Airport summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelaySummary"
  /delays/daily:
    get:
      operationId: getDailyDelays
      tags: [airports]
      summary: Daily flight delay trend
      parameters:
        - $ref: "#/components/parameters/Airport"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Airline"
        - $ref: "#/components/parameters/MetricRule"
      responses:
        "200":
          description: Daily data in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyDelay"
  /delays/carriers:
    get:
      operationId: getCarrierDelays
      tags: [airports]
      summary: Airline delay comparison for an airport
      parameters:
        - $ref: "#/components/parameters/Airport"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Airline"
        - $ref: "#/components/parameters/MetricRule"
      responses:
        "200":
          description: Carriers ordered by flight volume
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarrierDelay"
  /delays/causes:
    get:
      operationId: getDelayCauses
      tags: [airports]
      summary: BTS-reported causes of arrival delays
      parameters:
        - $ref: "#/components/parameters/Airport"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Airline"
        - $ref: "#/components/parameters/MetricRule"
      responses:
        "200":
          description: Total attributed minutes by cause
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DelayCause"
  /delays/weekday:
    get:
      operationId: getWeekdayDelays
      tags: [airports]
      summary: Departure delays grouped by day of week
      parameters:
        - $ref: "#/components/parameters/Airport"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Airline"
        - $ref: "#/components/parameters/MetricRule"
      responses:
        "200":
          description: Monday through Sunday
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeekdayDelay"
components:
  parameters:
    Airport:
      in: query
      name: airport
      required: true
      schema:
        type: string
        enum: [ATL, DFW, DEN, ORD, LAX, JFK, LGA, EWR, SFO, SEA, CLT, PHX, MIA, PHL, DCA, IAD, IAH, DTW, MSP, SLC, BOS, PDX, ANC, HNL, DAL, HOU, MDW, BWI, LAS, MCO, FLL, SJU]
    From:
      in: query
      name: from
      required: false
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
    To:
      in: query
      name: to
      required: false
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
    Airline:
      in: query
      name: airline
      required: false
      description: Repeat to include several reporting airlines. Omit for all airlines.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 32
        items:
          type: string
          pattern: '^[A-Z0-9]{2}$'
    MetricRule:
      in: query
      name: metric
      required: false
      description: >-
        Repeat for AND conditions on individual daily airport-and-airline aggregate rows,
        before grouping into dashboard totals. Format column:operator:nonnegativeInteger;
        operators are gte, lte, eq. An empty set of matching rows returns empty data.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 30
        items:
          type: string
          pattern: '^(flights|departure_flights|arrival_flights|delayed_departures|cancelled_flights|diverted_flights|total_dep_delay_minutes|total_arr_delay_minutes|carrier_delay_minutes|weather_delay_minutes|nas_delay_minutes|security_delay_minutes|late_aircraft_delay_minutes):(gte|lte|eq):[0-9]+$'
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Airport:
      type: object
      required: [code, name, city]
      properties:
        code: { type: string }
        name: { type: string }
        city: { type: string }
    DataStatus:
      type: object
      required: [sourceUrl, firstDate, lastDate, totalFlights, loadedMonths, importing]
      properties:
        sourceUrl: { type: string }
        firstDate: { type: ["string", "null"] }
        lastDate: { type: ["string", "null"] }
        totalFlights: { type: integer }
        loadedMonths:
          type: array
          items: { type: string }
        importing: { type: boolean }
    HubDelayRank:
      type: object
      required: [airport, flights, departureFlights, delayedDepartures, delayedDeparturePct]
      properties:
        airport: { type: string }
        flights: { type: integer }
        departureFlights: { type: integer }
        delayedDepartures: { type: integer }
        delayedDeparturePct: { type: number }
    DelaySummary:
      type: object
      required: [airport, from, to, flights, departureFlights, arrivalFlights, delayedDepartures, cancelledFlights, divertedFlights, totalDepDelayMinutes, totalArrDelayMinutes, carrierDelayMinutes, weatherDelayMinutes, nasDelayMinutes, securityDelayMinutes, lateAircraftDelayMinutes, onTimeDeparturePct, cancellationPct, avgDepartureDelayMinutes, avgArrivalDelayMinutes]
      properties:
        airport: { type: string }
        from: { type: ["string", "null"] }
        to: { type: ["string", "null"] }
        flights: { type: integer }
        departureFlights: { type: integer }
        arrivalFlights: { type: integer }
        delayedDepartures: { type: integer }
        cancelledFlights: { type: integer }
        divertedFlights: { type: integer }
        totalDepDelayMinutes: { type: integer }
        totalArrDelayMinutes: { type: integer }
        carrierDelayMinutes: { type: integer }
        weatherDelayMinutes: { type: integer }
        nasDelayMinutes: { type: integer }
        securityDelayMinutes: { type: integer }
        lateAircraftDelayMinutes: { type: integer }
        onTimeDeparturePct: { type: number }
        cancellationPct: { type: number }
        avgDepartureDelayMinutes: { type: number }
        avgArrivalDelayMinutes: { type: number }
    DailyDelay:
      type: object
      required: [date, flights, delayedDepartures, cancelledFlights, onTimeDeparturePct, avgDepartureDelayMinutes]
      properties:
        date: { type: string }
        flights: { type: integer }
        delayedDepartures: { type: integer }
        cancelledFlights: { type: integer }
        onTimeDeparturePct: { type: number }
        avgDepartureDelayMinutes: { type: number }
    CarrierDelay:
      type: object
      required: [code, flights, delayedDepartures, cancelledFlights, onTimeDeparturePct, avgDepartureDelayMinutes]
      properties:
        code: { type: string }
        flights: { type: integer }
        delayedDepartures: { type: integer }
        cancelledFlights: { type: integer }
        onTimeDeparturePct: { type: number }
        avgDepartureDelayMinutes: { type: number }
    DelayCause:
      type: object
      required: [cause, minutes]
      properties:
        cause:
          type: string
          enum: [Carrier, Weather, National Airspace, Security, Late Aircraft]
        minutes: { type: integer }
    WeekdayDelay:
      type: object
      required: [dayOfWeek, flights, delayedDepartures, onTimeDeparturePct]
      properties:
        dayOfWeek: { type: string }
        flights: { type: integer }
        delayedDepartures: { type: integer }
        onTimeDeparturePct: { type: number }

