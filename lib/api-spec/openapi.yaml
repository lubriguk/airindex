openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: airports
    description: BTS on-time performance for selected departure airports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /airports:
    get:
      operationId: listAirports
      tags: [airports]
      summary: List the supported departure airports
      responses:
        "200":
          description: Supported airport codes and names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Airport"
  /data-status:
    get:
      operationId: getDataStatus
      tags: [airports]
      summary: Dataset source and imported date coverage
      responses:
        "200":
          description: Current SQL dataset coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStatus"
  /delays/hub-ranking:
    get:
      operationId: getHubDelayRanking
      tags: [airports]
      summary: Rank the selected hubs and major bases by delayed-departure percentage
      description: >-
        Across all reporting airlines, group BTS daily rows by departure airport
        for the optional date range. The percentage is delayedDepartures divided
        by departureFlights, with a delay defined as 15 minutes or more.
        NAS minutes are attributed arrival-delay minutes for flights originating
        at each airport. NAS minutes per arrival divides nasDelayMinutes by
        arrivalFlights; NAS share divides nasDelayMinutes by the sum of carrier,
        weather, NAS, security, and late-aircraft attributed delay minutes.
        A rate is null when its denominator is zero. NAS values must not be
        interpreted as departure delays or proof of local airport responsibility.
        Only the 23 tracked airports in the supplied hub/base list are included;
        GUM is outside dataset coverage. Rows with no departure flights are omitted.
        Rows are sorted by delayedDeparturePct descending, then airport code;
        clients can reorder by NAS measure using the unrounded count fields.
        This comparison is independent of the single-airport airline and metric filters.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Hub and base airport delay ranking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HubDelayRank"
        "400":
          description: Invalid date range
  /delays/hub-airlines:
    get:
      operationId: listHubAirlines
      tags: [airports]
      summary: List supported reporting airlines and their configured hubs and bases
      description: >-
        Returns the user-supplied hub/base shortlist for each supported raw BTS
        Reporting_Airline code. Alaska (AS) and Hawaiian (HA) are listed
        separately. The airport lists are not a claim of an official or
        exhaustive carrier hub inventory; GUM is excluded because it is outside
        the BTS airport coverage used by this dashboard. Query parameters are
        not accepted.
      responses:
        "200":
          description: Reporting-airline options and configured airport codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HubAirlineOption"
        "400":
          description: Query parameters are not accepted
  /delays/airline-hubs:
    get:
      operationId: getAirlineHubRanking
      tags: [airports]
      summary: Rank one reporting airline's departures at its configured hubs and bases
      description: >-
        Uses the raw BTS Reporting_Airline code and the user-supplied
        hub/base shortlist returned by /delays/hub-airlines. It is not an
        all-carrier airport ranking and does not attribute responsibility to
        an airline or airport. Alaska (AS) and Hawaiian (HA) are distinct
        reporting-airline selections. GUM is excluded because it is outside the
        BTS airport coverage used by this dashboard. Returns one row for every
        configured airport, including airports with no reported departures in
        the selected period; their delayedDeparturePct is null and should be
        displayed as N/A, not zero. Rows are ordered by the unrounded delayed
        departures / departure flights ratio descending, with airports lacking
        a denominator last and airport code as the tie-breaker.
      parameters:
        - $ref: "#/components/parameters/HubAirline"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Selected reporting airline's hub and base departure metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirlineHubRanking"
        "400":
          description: Invalid reporting-airline code or date range
  /delays/summary:
    get:
      operationId: getDelaySummary
      tags: [airports]
      summary: Key flight and delay metrics for an airport
      parameters:
        - $ref: "#/components/parameters/Airport"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Airline"
        - $ref: "#/components/parameters/MetricRule"
      responses:
        "200":
          description: Airport summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelaySummary"
  /delays/daily:
    get:
      operationId: getDailyDelays
      tags: [airports]
      summary: Daily flight delay trend
      parameters:
        - $ref: "#/components/parameters/Airport"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Airline"
        - $ref: "#/components/parameters/MetricRule"
      responses:
        "200":
          description: Daily data in chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyDelay"
  /delays/carriers:
    get:
      operationId: getCarrierDelays
      tags: [airports]
      summary: Airline delay comparison for an airport
      parameters:
        - $ref: "#/components/parameters/Airport"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Airline"
        - $ref: "#/components/parameters/MetricRule"
      responses:
        "200":
          description: Carriers ordered by flight volume
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarrierDelay"
  /delays/causes:
    get:
      operationId: getDelayCauses
      tags: [airports]
      summary: BTS-reported causes of arrival delays
      parameters:
        - $ref: "#/components/parameters/Airport"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Airline"
        - $ref: "#/components/parameters/MetricRule"
      responses:
        "200":
          description: Total attributed minutes by cause
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DelayCause"
  /delays/weekday:
    get:
      operationId: getWeekdayDelays
      tags: [airports]
      summary: Departure delays grouped by day of week
      parameters:
        - $ref: "#/components/parameters/Airport"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Airline"
        - $ref: "#/components/parameters/MetricRule"
      responses:
        "200":
          description: Monday through Sunday
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeekdayDelay"
components:
  parameters:
    Airport:
      in: query
      name: airport
      required: true
      schema:
        type: string
        enum: [ATL, DFW, DEN, ORD, LAX, JFK, LGA, EWR, SFO, SEA, CLT, PHX, MIA, PHL, DCA, IAD, IAH, DTW, MSP, SLC, BOS, PDX, ANC, HNL, DAL, HOU, MDW, BWI, LAS, MCO, FLL, SJU]
    From:
      in: query
      name: from
      required: false
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
    To:
      in: query
      name: to
      required: false
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
    HubAirline:
      in: query
      name: airline
      required: true
      description: Raw BTS Reporting_Airline code from the supported hub-airline shortlist.
      schema:
        type: string
        enum: [UA, AS, HA, WN, B6, F9, G4]
    Airline:
      in: query
      name: airline
      required: false
      description: Repeat to include several reporting airlines. Omit for all airlines.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 32
        items:
          type: string
          pattern: '^[A-Z0-9]{2}$'
    MetricRule:
      in: query
      name: metric
      required: false
      description: >-
        Repeat for AND conditions on individual daily airport-and-airline aggregate rows,
        before grouping into dashboard totals. Format column:operator:nonnegativeInteger;
        operators are gte, lte, eq. An empty set of matching rows returns empty data.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 30
        items:
          type: string
          pattern: '^(flights|departure_flights|arrival_flights|delayed_departures|cancelled_flights|diverted_flights|total_dep_delay_minutes|total_arr_delay_minutes|carrier_delay_minutes|weather_delay_minutes|nas_delay_minutes|security_delay_minutes|late_aircraft_delay_minutes):(gte|lte|eq):[0-9]+$'
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Airport:
      type: object
      required: [code, name, city]
      properties:
        code: { type: string }
        name: { type: string }
        city: { type: string }
    DataStatus:
      type: object
      required: [sourceUrl, firstDate, lastDate, totalFlights, loadedMonths, importing]
      properties:
        sourceUrl: { type: string }
        firstDate: { type: ["string", "null"] }
        lastDate: { type: ["string", "null"] }
        totalFlights: { type: integer }
        loadedMonths:
          type: array
          items: { type: string }
        importing: { type: boolean }
    HubDelayRank:
      type: object
      required: [airport, flights, departureFlights, delayedDepartures, delayedDeparturePct, arrivalFlights, nasDelayMinutes, attributedDelayMinutes, nasMinutesPerArrival, nasAttributedSharePct]
      properties:
        airport: { type: string }
        flights: { type: integer }
        departureFlights: { type: integer }
        delayedDepartures: { type: integer }
        delayedDeparturePct: { type: number }
        arrivalFlights: { type: integer, description: Flights with reported arrival times }
        nasDelayMinutes: { type: integer, description: BTS NAS-attributed arrival delay minutes }
        attributedDelayMinutes: { type: integer, description: Sum of five BTS attributed arrival-delay cause minute fields }
        nasMinutesPerArrival: { type: ["number", "null"], description: NAS minutes divided by arrivalFlights }
        nasAttributedSharePct: { type: ["number", "null"], description: NAS minutes as a percentage of attributedDelayMinutes }
    HubAirlineOption:
      type: object
      required: [code, name, airports]
      properties:
        code:
          type: string
          enum: [UA, AS, HA, WN, B6, F9, G4]
          description: Raw BTS Reporting_Airline code
        name: { type: string }
        airports:
          type: array
          description: User-supplied hub/base shortlist; not an exhaustive official inventory
          items: { type: string }
    AirlineHubRanking:
      type: object
      required: [airline, airports]
      properties:
        airline:
          type: object
          required: [code, name]
          properties:
            code:
              type: string
              enum: [UA, AS, HA, WN, B6, F9, G4]
            name: { type: string }
        airports:
          type: array
          items:
            $ref: "#/components/schemas/AirlineHubRow"
    AirlineHubRow:
      type: object
      required: [airport, flights, departureFlights, delayedDepartures, delayedDeparturePct]
      properties:
        airport: { type: string }
        flights: { type: integer }
        departureFlights: { type: integer }
        delayedDepartures: { type: integer }
        delayedDeparturePct:
          type: ["number", "null"]
          description: Delayed departures divided by departure flights; null when the denominator is zero (display as N/A)
    DelaySummary:
      type: object
      required: [airport, from, to, flights, departureFlights, arrivalFlights, delayedDepartures, cancelledFlights, divertedFlights, totalDepDelayMinutes, totalArrDelayMinutes, carrierDelayMinutes, weatherDelayMinutes, nasDelayMinutes, securityDelayMinutes, lateAircraftDelayMinutes, onTimeDeparturePct, cancellationPct, avgDepartureDelayMinutes, avgArrivalDelayMinutes]
      properties:
        airport: { type: string }
        from: { type: ["string", "null"] }
        to: { type: ["string", "null"] }
        flights: { type: integer }
        departureFlights: { type: integer }
        arrivalFlights: { type: integer }
        delayedDepartures: { type: integer }
        cancelledFlights: { type: integer }
        divertedFlights: { type: integer }
        totalDepDelayMinutes: { type: integer }
        totalArrDelayMinutes: { type: integer }
        carrierDelayMinutes: { type: integer }
        weatherDelayMinutes: { type: integer }
        nasDelayMinutes: { type: integer }
        securityDelayMinutes: { type: integer }
        lateAircraftDelayMinutes: { type: integer }
        onTimeDeparturePct: { type: number }
        cancellationPct: { type: number }
        avgDepartureDelayMinutes: { type: number }
        avgArrivalDelayMinutes: { type: number }
    DailyDelay:
      type: object
      required: [date, flights, delayedDepartures, cancelledFlights, onTimeDeparturePct, avgDepartureDelayMinutes]
      properties:
        date: { type: string }
        flights: { type: integer }
        delayedDepartures: { type: integer }
        cancelledFlights: { type: integer }
        onTimeDeparturePct: { type: number }
        avgDepartureDelayMinutes: { type: number }
    CarrierDelay:
      type: object
      required: [code, flights, delayedDepartures, cancelledFlights, onTimeDeparturePct, avgDepartureDelayMinutes]
      properties:
        code: { type: string }
        flights: { type: integer }
        delayedDepartures: { type: integer }
        cancelledFlights: { type: integer }
        onTimeDeparturePct: { type: number }
        avgDepartureDelayMinutes: { type: number }
    DelayCause:
      type: object
      required: [cause, minutes]
      properties:
        cause:
          type: string
          enum: [Carrier, Weather, National Airspace, Security, Late Aircraft]
        minutes: { type: integer }
    WeekdayDelay:
      type: object
      required: [dayOfWeek, flights, delayedDepartures, onTimeDeparturePct]
      properties:
        dayOfWeek: { type: string }
        flights: { type: integer }
        delayedDepartures: { type: integer }
        onTimeDeparturePct: { type: number }

